#
# This workflow calls the main distribution pipeline from DuckDB to build, test and release extensions
#
name: Extensions (all platforms)
on:
  workflow_call:
#    inputs:
#      override_git_describe:
#        type: string
#      git_ref:
#        type: string
#      skip_tests:
#        type: string
  workflow_dispatch:
#    inputs:
#      override_git_describe:
#        type: string
#      git_ref:
#        type: string
#      skip_tests:
#        type: string
  push:
    branches-ignore:
      - 'main'
      - 'feature'
      - 'v*.*-*'
    paths-ignore:
      - '**.md'
      - 'tools/**'
      - '!tools/shell/**'
      - '.github/patches/duckdb-wasm/**'
      - '.github/workflows/**'
      - '!.github/workflows/Extensions.yml'
  merge_group:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'tools/**'
      - '!tools/shell/**'
      - '.github/patches/duckdb-wasm/**'
      - '.github/workflows/**'
      - '!.github/workflows/Extensions.yml'

jobs:
  in-tree-extensions-1:
    name: In-tree Extensions 1
    uses: ./.github/workflows/_extension_distribution.yml
    with:
      exclude_archs: 'linux_arm64;linux_amd64;linux_amd64_musl;osx_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;windows_amd64'
      artifact_prefix: in-tree-extensions-1
      extension_config: |
        duckdb_extension_load(json)

  in-tree-extensions-2:
    name: In-tree Extensions 2
    uses: ./.github/workflows/_extension_distribution.yml
    with:
      exclude_archs: 'linux_arm64;linux_amd64;linux_amd64_musl;osx_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;windows_amd64'
      artifact_prefix: in-tree-extensions-2
      extension_config: |
        duckdb_extension_load(tpch)

  create-extension-repository:
    name: Create Extension Repository
    runs-on: ubuntu-latest
    needs:
      - in-tree-extensions-1
      - in-tree-extensions-2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - uses: actions/download-artifact@v4
        with:
          pattern: in-tree-extensions-1-${{ github.sha }}*
          path: /tmp/repository_generation/in-tree-extensions-1

      - uses: actions/download-artifact@v4
        with:
          pattern: in-tree-extensions-2-${{ github.sha }}*
          path: /tmp/repository_generation/in-tree-extensions-2

      - name: Print all extensions
        run: |
          tree /tmp/repository_generation