#
# This workflow calls the main distribution pipeline from DuckDB to build, test and release extensions
#
name: Extensions (all platforms)
on:
  workflow_call:
#    inputs:
#      override_git_describe:
#        type: string
#      git_ref:
#        type: string
#      skip_tests:
#        type: string
  workflow_dispatch:
#    inputs:
#      override_git_describe:
#        type: string
#      git_ref:
#        type: string
#      skip_tests:
#        type: string
  push:
    branches-ignore:
      - 'main'
      - 'feature'
      - 'v*.*-*'
    paths-ignore:
      - '**.md'
      - 'tools/**'
      - '!tools/shell/**'
      - '.github/patches/duckdb-wasm/**'
      - '.github/workflows/**'
      - '!.github/workflows/Extensions.yml'
  merge_group:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'tools/**'
      - '!tools/shell/**'
      - '.github/patches/duckdb-wasm/**'
      - '.github/workflows/**'
      - '!.github/workflows/Extensions.yml'

jobs:
  duckdb-in-tree-extensions:
    name: Extension template
    uses: samansmink/extension-ci-tools/.github/workflows/_extension_distribution.yml@add-extension-config-injection
    with:
      extension_name: quack # placeholder, make optional?

      override_repository: duckdb/extension-template
      override_ref: main

      duckdb_version: ${{ github.sha }}
      override_duckdb_repository: https://github.com/${{ github.repository }}.git # TODO: required to run this on forks?

      override_ci_tools_repository: samansmink/extension-ci-tools # TODO: remove once merged
      ci_tools_version: add-extension-config-injection # TODO: switch to main once merged

      # TODO: re-enable caching

      upload_all_extensions_as: ${{ vars.JOB_NAME }}-${{ github.sha }}

      extra_extension_config: |
        duckdb_extension_load(autocomplete)
        duckdb_extension_load(core_functions)
        duckdb_extension_load(icu)
        duckdb_extension_load(json)
        duckdb_extension_load(parquet)
        duckdb_extension_load(tpcds)
        duckdb_extension_load(tpch)
        
        # Test extension for the upcoming C CAPI extensions
        duckdb_extension_load(demo_capi DONT_LINK)